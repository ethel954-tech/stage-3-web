<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insighta Labs+ - Profile Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background: #f5f7fa;
    color: #333;
}
.navbar {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
}
.navbar-brand { font-weight: 700; font-size: 20px; }
.nav-links { display: flex; gap: 25px; }
.nav-links a {
    color: rgba(255,255,255,0.9);
    text-decoration: none;
    font-weight: 500;
}
.nav-links a:hover, .nav-links a.active { color: white; }
.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 0 20px;
}
.card {
    background: white;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
.back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #667eea;
    text-decoration: none;
    font-weight: 500;
}
.back-link:hover { text-decoration: underline; }
.profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
}
.profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 28px;
    font-weight: 700;
}
.profile-title h1 { margin: 0; font-size: 24px; }
.profile-title p { margin: 4px 0 0; color: #666; }
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}
.field {
    background: #f8f9fa;
    padding: 16px;
    border-radius: 12px;
}
.field label {
    display: block;
    font-size: 12px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
}
.field span {
    font-size: 18px;
    font-weight: 600;
    color: #2c3e50;
}
.delete-btn {
    background: linear-gradient(135deg, #ff6b6b, #ee5a52);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 20px;
}
.user-info { display: flex; align-items: center; gap: 10px; }
.user-info img { width: 32px; height: 32px; border-radius: 50%; }
.logout-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand">Insighta Labs+</div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profiles.html">Profiles</a>
        <a href="search.html">Search</a>
        <a href="account.html">Account</a>
    </div>
    <div class="user-info">
        <img id="avatar" src="" alt="">
        <span id="username"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>
<div class="container">
    <a href="profiles.html" class="back-link">&larr; Back to Profiles</a>
    <div class="card">
        <div class="profile-header">
            <div class="profile-avatar" id="profileInitial">?</div>
            <div class="profile-title">
                <h1 id="profileName">-</h1>
                <p id="profileId">-</p>
            </div>
        </div>
        <div class="grid">
            <div class="field"><label>Gender</label><span id="profileGender">-</span></div>
            <div class="field"><label>Gender Probability</label><span id="profileGenderProb">-</span></div>
            <div class="field"><label>Age</label><span id="profileAge">-</span></div>
            <div class="field"><label>Age Group</label><span id="profileAgeGroup">-</span></div>
            <div class="field"><label>Country</label><span id="profileCountry">-</span></div>
            <div class="field"><label>Country Probability</label><span id="profileCountryProb">-</span></div>
            <div class="field"><label>Created</label><span id="profileCreated">-</span></div>
        </div>
        <button class="delete-btn" id="deleteBtn" style="display:none;" onclick="deleteProfile()">Delete Profile</button>
    </div>
</div>
<script src="api.js"></script>
<script>
let profileId = '';

async function loadProfile() {
    try {
        console.log('[PROFILE] Loading profile...');
        
        // Check authentication
        const user = await requireAuth();
        if (!user) return;

        // Display user info
        document.getElementById('username').textContent = '@' + user.username;
        document.getElementById('avatar').src = user.avatar_url || 'https://github.com/github.png';
        
        // Show delete button for admins
        if (user.role === 'admin') {
            document.getElementById('deleteBtn').style.display = 'inline-block';
        }

        // Get profile ID from URL
        const params = new URLSearchParams(window.location.search);
        profileId = params.get('id');
        if (!profileId) {
            console.log('[PROFILE] No ID in URL, redirecting to profiles');
            window.location.href = 'profiles.html';
            return;
        }

        // Fetch profile details
        console.log('[PROFILE] Fetching profile:', profileId);
        const data = await apiCall(`/api/profiles/${profileId}`, { method: 'GET' });
        const p = data.data;

        // Display profile info
        document.getElementById('profileInitial').textContent = p.name.charAt(0).toUpperCase();
        document.getElementById('profileName').textContent = p.name;
        document.getElementById('profileId').textContent = p.id;
        document.getElementById('profileGender').textContent = p.gender || 'N/A';
        document.getElementById('profileGenderProb').textContent = p.gender_probability != null 
            ? (p.gender_probability * 100).toFixed(1) + '%' 
            : 'N/A';
        document.getElementById('profileAge').textContent = p.age || 'N/A';
        document.getElementById('profileAgeGroup').textContent = p.age_group || 'N/A';
        document.getElementById('profileCountry').textContent = (p.country_id || 'N/A') 
            + (p.country_name ? ' (' + p.country_name + ')' : '');
        document.getElementById('profileCountryProb').textContent = p.country_probability != null 
            ? (p.country_probability * 100).toFixed(1) + '%' 
            : 'N/A';
        document.getElementById('profileCreated').textContent = new Date(p.created_at).toLocaleString();

        console.log('[PROFILE] Profile loaded:', p.name);
    } catch (error) {
        console.error('[PROFILE] Error:', error);
        if (error.message.includes('404')) {
            window.location.href = 'profiles.html';
        } else {
            alert('Failed to load profile: ' + error.message);
        }
    }
}

async function deleteProfile() {
    if (!confirm('Are you sure you want to delete this profile?')) return;
    
    try {
        console.log('[PROFILE] Deleting profile:', profileId);
        await apiCall(`/api/profiles/${profileId}`, {
            method: 'DELETE'
        });
        
        console.log('[PROFILE] Profile deleted');
        alert('Profile deleted successfully');
        window.location.href = 'profiles.html';
    } catch (error) {
        console.error('[PROFILE] Delete error:', error);
        alert('Failed to delete profile: ' + error.message);
    }
}

// Load profile on page ready
document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
